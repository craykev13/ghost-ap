<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GhostAP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v9l2.7-2 2.6 2 2.7-2 2.7 2 2.6-2 2.7 2v-9a8 8 0 0 0-8-8Zm-3 8.5a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm6 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
    <h1>GhostAP</h1>
    <p class="muted">Sign in to the admin page</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p id="login-error" class="error" role="alert"></p>
    <button id="login-button" type="submit" class="primary">Sign in</button>
  </form>
</main>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand">
      <svg class="logo small" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8v9l2.7-2 2.6 2 2.7-2 2.7 2 2.6-2 2.7 2v-9a8 8 0 0 0-8-8Zm-3 8.5a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm6 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
      <span>GhostAP</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a id="nav-status" class="nav-item active" href="#status" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4l3-8 4 14 3-6h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Status
      </a>
      <a id="nav-settings" class="nav-item" href="#settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        Settings
      </a>
      <span class="nav-item soon" aria-disabled="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h9M5 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Logs <em>soon</em>
      </span>
    </nav>
    <button id="logout" class="ghost" type="button">Sign out</button>
  </aside>

  <section class="main">
    <header class="top">
      <h2 id="title">Status</h2>
      <span id="pill" class="pill">Loading</span>
    </header>
    <p id="banner" class="banner" role="status" hidden></p>
    <div id="status-view">
      <div id="cards" class="cards"></div>
      <p id="updated" class="muted small"></p>
    </div>
    <form id="settings-view" class="settings" hidden novalidate>
      <p class="note">Changes are saved to the config file. They are <strong>not live yet</strong>:
        they apply the next time the Pi starts its own network, or when you use
        <strong>Try the saved settings</strong> below, which undoes itself if something goes wrong.</p>
      <div id="settings-body"></div>
      <label class="check"><input id="show-advanced" type="checkbox"> Show advanced settings</label>
      <p id="settings-msg" class="form-msg" role="status"></p>
      <div class="actions">
        <button id="settings-save" class="primary" type="submit" disabled>Save changes</button>
        <button id="settings-undo" class="secondary" type="button" disabled>Undo edits</button>
      </div>
      <div id="apply-card" class="card apply"></div>
    </form>
  </section>
</div>

<script src="/app.js"></script>
</body>
</html>
