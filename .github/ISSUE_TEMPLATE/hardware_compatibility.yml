name: Hardware compatibility report
description: Share your experience running GhostAP on different hardware
title: "[Hardware]: "
body:
  - type: markdown
    attributes:
      value: |
        Hardware compatibility reports help expand GhostAP's tested hardware list.
        Both successful and unsuccessful results are welcome.

  - type: input
    id: hardware
    attributes:
      label: Hardware model and revision
      placeholder: Raspberry Pi 3 Model B+
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Raspberry Pi OS Lite (Trixie)
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - 32-bit (ARM)
        - 64-bit (ARM64)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GhostAP version or commit
    validations:
      required: true

  - type: input
    id: wireless
    attributes:
      label: Wireless adapter or chipset
      placeholder: Built-in WiFi or external adapter

  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Fully functional
        - Partially functional
        - Not functional
        - Testing in progress
    validations:
      required: true

  - type: checkboxes
    id: verified
    attributes:
      label: Successfully tested functionality
      description: Select only the features you have personally verified.
      options:
        - label: Installation
        - label: Preflight checks
        - label: Boot fallback
        - label: Runtime failover
        - label: AP connectivity
        - label: DHCP address assignment
        - label: Live testing and rollback
        - label: Return to known WiFi after reboot
        - label: Admin page
        - label: Restart and shutdown

  - type: textarea
    id: observations
    attributes:
      label: Observations
      description: Describe any hardware-specific behaviour, limitations or workarounds.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and diagnostic output
      description: Remove passwords and sensitive information before submitting.
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: These results are from testing on physical hardware.
          required: true
        - label: I have removed sensitive information from this report.
          required: true
