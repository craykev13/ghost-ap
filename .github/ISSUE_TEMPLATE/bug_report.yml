name: Bug report
description: Report a problem with GhostAP
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve GhostAP.
        Please do not include passwords or other sensitive information.

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Raspberry Pi Zero W
        - Raspberry Pi Zero 2 W
        - Raspberry Pi 3B
        - Raspberry Pi 3B+
        - Raspberry Pi 4
        - Raspberry Pi 5
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Raspberry Pi OS Lite (Trixie)
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - 32-bit (ARM)
        - 64-bit (ARM64)
        - Other
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GhostAP version or commit
      placeholder: Commit hash or release version
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Installer
        - Boot fallback
        - Runtime failover
        - Live testing and rollback
        - Admin page
        - Configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the problem
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostic output
      description: Remove passwords and sensitive information before submitting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional information

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have checked for existing issues describing this problem.
          required: true
        - label: I have removed sensitive information from this report.
          required: true
        - label: This is not a security vulnerability report.
          required: true
